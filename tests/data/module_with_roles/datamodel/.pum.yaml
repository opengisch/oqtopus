pum:
  module: oqtopus_test_roles

changelogs_directory: changelogs

roles:
  - name: oqtopus_test_viewer
    permissions:
      - type: read
        schemas:
          - oqtopus_test_roles
          - oqtopus_test_roles_app
    description: Viewer role with read permissions.

  - name: oqtopus_test_editor
    permissions:
      - type: write
        schemas:
          - oqtopus_test_roles
    description: Editor role with write permissions.

application:
  drop:
    - code: DROP SCHEMA IF EXISTS oqtopus_test_roles_app CASCADE;
  create:
    - file: app/create_app.sql
