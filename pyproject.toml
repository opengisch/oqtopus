[build-system]
requires = [
    "setuptools>=61.0",
    "setuptools-git-versioning"
]
build-backend = "setuptools.build_meta"

[project]
name = "oqtopus"
description = "oQtopus : A QGIS module manager that helps you deploy, manage and upgrade your QGIS projects, plugins and associated postgreSQL / PostGIS data model implementations"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
  { name="Damiano Lombardi", email="damiano@opengis.ch" }
]

[tool.setuptools.packages.find]
where = ["."]
# only ship the package itself: auto-discovery would otherwise also pick up
# tests/ (a regular package) and scripts/ (a PEP 420 namespace package)
include = ["oqtopus*"]
namespaces = false

[tool.setuptools-git-versioning]
enabled = true
starting_version = "0.0.1"

[tool.setuptools.package-data]
"oqtopus" = ["**/*.ui", "libs/*.dist-info/**"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
optional-dependencies.standalone = {file = ["requirements-standalone.txt"]}

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "skipif: conditionally skip tests",
]
